<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecLora - Home</title>
    <!-- Link to your external stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="reclora-body-wrapper">

    <!-- SIDEBAR NAVIGATION -->
    <nav class="rec-sidebar">
        <!-- Sidebar Logo Placeholder -->
        <img class="rec-sidebar-logo" src="your-sidebar-logo-here.png" alt="RecLora Logo Placeholder" onerror="this.style.display='none'; this.after('REC LORA')">
        
        <a href="#" class="rec-btn-download">Download</a>
        <a href="#" class="rec-btn-music">🎵 Music</a>
        
        <ul class="rec-nav-links">
            <li><a href="#">🏠 Home</a></li>
            <li><a href="#">📺 RecTube</a></li>
            <li><a href="#">🛒 Shop</a></li>
            <li><a href="#">👥 Users</a></li>
            <li><a href="#">🚪 Rooms</a></li>
            <li><a href="#">📅 Events</a></li>
            <li><a href="#">💡 Inventions</a></li>
            <li><a href="#">ℹ️ Credit</a></li>
        </ul>
    </nav>

    <!-- MAIN CONTENT AREA -->
    <main class="rec-main-content">
        
        <!-- HERO BANNER -->
        <section class="rec-hero">
            <!-- Main Hero Logo Placeholder -->
            <img class="rec-main-logo" src="your-main-logo-here.png" alt="RecLora Big Logo Placeholder" onerror="this.style.display='none'; this.after('REC LORA')">
            
            <h1>Join the fun for free!</h1>
            <a href="#" class="rec-btn-download-hero">Download</a>
        </section>

        <!-- MEDIA CONTENT GRID -->
        <section class="rec-grid-container">
            
            <!-- Card 1 -->
            <div class="rec-grid-card">
                <img class="rec-media-placeholder" src="feature1.png" alt="Cross-Platform Gameplay Placeholder">
                <h3>Cross-Platform</h3>
            </div>

            <!-- Card 2 -->
            <div class="rec-grid-card">
                <img class="rec-media-placeholder" src="feature2.png" alt="Create Mode Placeholder">
                <h3>Create</h3>
            </div>

            <!-- Card 3 -->
            <div class="rec-grid-card">
                <img class="rec-media-placeholder" src="feature3.png" alt="Compete Gameplay Placeholder">
                <h3>Compete</h3>
            </div>

            <!-- Card 4 -->
            <div class="rec-grid-card">
                <img class="rec-media-placeholder" src="feature4.png" alt="Cooperate Gameplay Placeholder">
                <h3>Cooperate</h3>
            </div>

        </section>

        <!-- COMMUNITY SECTION -->
        <section class="rec-community-section">
            <h2>Join Our Community</h2>
            
            <!-- Discord Widget Mockup -->
            <div class="rec-discord-widget">
                <div class="rec-discord-header">
                    <span class="rec-discord-logo-placeholder">Discord</span>
                    <span class="rec-discord-users">203 Members Online</span>
                </div>
                <div class="rec-discord-channels">
                    <div>🔊 Stage</div>
                    <div>👤 user_example_1</div>
                    <div>👤 user_example_2</div>
                    <div>💬 Talk</div>
                </div>
            </div>
        </section>

    </main>

</body>
</html>
