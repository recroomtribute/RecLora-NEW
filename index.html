<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RecLora — Join the fun for free</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="app">

  <!-- Sidebar (desktop) / topbar (mobile) -->
  <header class="sidebar">
    <div class="brand">
      <span class="brand-mark">RL</span>
      <span class="brand-name">RecLora</span>
    </div>

    <button class="btn btn-outline nav-download">Download</button>
    <button class="btn btn-solid nav-music">♪ Music</button>

    <nav class="nav-links">
      <a href="#home" class="active"><span class="ic">⌂</span> Home</a>
      <a href="#loratube"><span class="ic">▶</span> LoraTube</a>
      <a href="#shop"><span class="ic">🛍</span> Shop</a>
      <a href="#users"><span class="ic">👥</span> Users</a>
      <a href="#rooms"><span class="ic">🚪</span> Rooms</a>
      <a href="#events"><span class="ic">🎟</span> Events</a>
      <a href="#inventions"><span class="ic">💡</span> Inventions</a>
      <a href="#credit"><span class="ic">ⓘ</span> Credit</a>
    </nav>
  </header>

  <main>

    <!-- Hero -->
    <section class="hero" id="home">
      <div class="hero-tiles" aria-hidden="true"></div>
      <div class="hero-content">
        <div class="hero-logo">
          <span class="hero-logo-word">REC</span>
          <span class="hero-logo-badge">L</span>
          <span class="hero-logo-word">LORA</span>
        </div>
        <p class="hero-tag">Join the fun for free!</p>
        <button class="btn btn-cta">Download</button>
      </div>
    </section>

    <!-- Feature grid -->
    <section class="features">
      <div class="feature-card">
        <div class="ph ph-a">
          <span class="ph-label">placeholder image</span>
        </div>
        <h3>Cross-Platform</h3>
      </div>
      <div class="feature-card">
        <div class="ph ph-b">
          <span class="ph-label">placeholder image</span>
        </div>
        <h3>Create</h3>
      </div>
      <div class="feature-card">
        <div class="ph ph-c">
          <span class="ph-label">placeholder image</span>
        </div>
        <h3>Compete</h3>
      </div>
      <div class="feature-card">
        <div class="ph ph-d">
          <span class="ph-label">placeholder image</span>
        </div>
        <h3>Cooperate</h3>
      </div>
    </section>

    <!-- Community -->
    <section class="community">
      <h2>Join our community</h2>
      <a href="#" class="discord-card">
        <div class="discord-top">
          <span class="discord-icon">◎</span>
          <span class="discord-title">Discord</span>
          <span class="discord-online">203 Members Online</span>
        </div>
      </a>
    </section>

  </main>
</div>

</body>
</html>
